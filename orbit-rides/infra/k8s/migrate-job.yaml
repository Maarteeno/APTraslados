# Las migraciones corren como Job, NO como initContainer del Deployment.
#
# Con initContainer, cada réplica intentaría migrar al arrancar y competirían
# entre sí. Un Job corre una vez, y si falla el rollout no avanza.
apiVersion: batch/v1
kind: Job
metadata:
  name: orbit-migrate
  namespace: orbit
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: orbit-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: migrate
          image: ghcr.io/TU_ORG/orbit-api:latest   # reemplazar
          command: ["node", "services/api/dist/scripts/migrate.js"]
          envFrom:
            - configMapRef: { name: orbit-api-config }
            - secretRef:    { name: orbit-api-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
