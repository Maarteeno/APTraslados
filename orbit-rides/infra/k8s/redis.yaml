apiVersion: v1
kind: Service
metadata:
  name: orbit-redis
  namespace: orbit
spec:
  clusterIP: None          # headless: el StatefulSet resuelve por DNS estable
  selector:
    app: orbit-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orbit-redis
  namespace: orbit
spec:
  serviceName: orbit-redis
  replicas: 1
  selector:
    matchLabels:
      app: orbit-redis
  template:
    metadata:
      labels:
        app: orbit-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            # noeviction es deliberado: si Redis se llena preferimos que las
            # escrituras fallen ruidosamente antes que perder locks de dispatch
            # en silencio y terminar con viajes doblemente asignados.
            - --maxmemory-policy
            - noeviction
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
