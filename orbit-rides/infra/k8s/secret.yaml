# PLANTILLA. No commitear con valores reales.
#
# En serio: usá External Secrets Operator, Sealed Secrets o SOPS. Un Secret de
# Kubernetes es base64, no cifrado — cualquiera con acceso de lectura al
# namespace lo ve en claro.
apiVersion: v1
kind: Secret
metadata:
  name: orbit-api-secrets
  namespace: orbit
type: Opaque
stringData:
  DATABASE_URL: "postgres://usuario:clave@tu-postgres-administrado:5432/orbit?sslmode=require"
  REDIS_URL: "redis://orbit-redis:6379"
  QUOTE_SIGNING_SECRET: "REEMPLAZAR — node -e \"console.log(require('crypto').randomBytes(32).toString('hex'))\""
  AUTH_DEV_SECRET: "REEMPLAZAR — no se usa con AUTH_MODE=firebase, pero la config lo exige"
  FIREBASE_PROJECT_ID: "REEMPLAZAR"
  MAPBOX_TOKEN: "REEMPLAZAR"
